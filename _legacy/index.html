<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Luis Castellanos | Welcome</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="landing-container">
      <h1 class="landing-title">Hello!</h1>
      <p class="landing-subtitle">Please enter your name to continue</p>
      
      <form id="login-form">
        <input 
          type="text" 
          id="username" 
          class="landing-input" 
          placeholder="Type your name..." 
          required 
          autocomplete="off"
        />
        <br>
        <button type="submit" class="btn primary landing-btn">Enter Portfolio</button>
      </form>
    </div>

    <div id="snow-root"></div>

    <script>
      document.getElementById('login-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const name = document.getElementById('username').value;
        if (name.trim()) {
          // Optional: You could save the name to use it on the next page
          localStorage.setItem('visitorName', name);
          
          // Add a fade out effect if desired, but for now just redirect
          document.body.style.opacity = '0';
          document.body.style.transition = 'opacity 0.5s ease';
          
          setTimeout(() => {
            window.location.href = 'home.html';
          }, 500);
        }
      });
    </script>

    <script type="module">
      import React from "https://esm.sh/react@18.3.1";
      import { createRoot } from "https://esm.sh/react-dom@18.3.1/client";
      import Snowfall from "https://esm.sh/react-snowfall@2.4.0?deps=react@18.3.1,react-dom@18.3.1";

      const root = createRoot(document.getElementById("snow-root"));

      root.render(
        React.createElement(Snowfall, {
          snowflakeCount: 150,
          style: { position: "fixed", top: 0, left: 0, width: "100vw", height: "100vh" },
        })
      );
    </script>
  </body>
</html>
